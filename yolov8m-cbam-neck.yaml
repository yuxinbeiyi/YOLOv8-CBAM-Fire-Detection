
# YOLOv8m-CBAM-Neck: backbone CBAM × 3  +  neck CBAM × 4  =  共 7 个 CBAM
# 在原 yolov8m-cbam.yaml 基础上，在 neck 每个 C2f 融合块输出后各插入一个 CBAM
# 兼容: ultralytics 8.3.18, Python 3.12, PyTorch 2.10
#
# 7个通道说明 (width_multiple=0.75):
#   backbone P3 : 256×0.75 = 192   → CBAM [192]  (layer 5)
#   backbone P4 : 512×0.75 = 384   → CBAM [384]  (layer 8)
#   backbone SPPF: 768×0.75 = 576  → CBAM [576]  (layer 12)
#
#   neck top-down  P4: C2f(512)→384  → CBAM [384]  (layer 16)  ★新增
#   neck top-down  P3: C2f(256)→192  → CBAM [192]  (layer 20)  ★新增 → Detect P3
#   neck bottom-up P4: C2f(512)→384  → CBAM [384]  (layer 24)  ★新增 → Detect P4
#   neck bottom-up P5: C2f(768)→576  → CBAM [576]  (layer 28)  ★新增 → Detect P5
#
# 注意: CBAM 不改变通道数，args 使用实际通道数（缩放后），否则会维度不匹配

nc: 2              # 类别数（fire和smoke类）
depth_multiple: 0.67
width_multiple: 0.75

# ── Backbone ──────────────────────────────────────────────────
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]    # 0  - P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1  - P2/4
  - [-1, 3, C2f, [128, True]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]   # 3  - P3/8
  - [-1, 6, C2f, [256, True]]    # 4
  - [-1, 1, CBAM, [192]]         # 5  - backbone P3 CBAM  (192=256×0.75)
  - [-1, 1, Conv, [512, 3, 2]]   # 6  - P4/16
  - [-1, 6, C2f, [512, True]]    # 7
  - [-1, 1, CBAM, [384]]         # 8  - backbone P4 CBAM  (384=512×0.75)
  - [-1, 1, Conv, [768, 3, 2]]   # 9  - P5/32
  - [-1, 3, C2f, [768, True]]    # 10
  - [-1, 1, SPPF, [768, 5]]      # 11
  - [-1, 1, CBAM, [576]]         # 12 - backbone SPPF CBAM (576=768×0.75)

# ── Head (FPN top-down + PAN bottom-up) ───────────────────────
head:

  # === Top-down (FPN) ===
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13  upsample SPPF_CBAM(576)
  - [[-1, 8], 1, Concat, [1]]    # 14  cat [13, 8]  → 576+384=960
  - [-1, 3, C2f, [512]]          # 15  → 384ch
  - [-1, 1, CBAM, [384]]         # 16  ★ neck CBAM：top-down P4 融合输出 (384ch)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 17  upsample neck_P4_CBAM(384)
  - [[-1, 5], 1, Concat, [1]]    # 18  cat [17, 5]  → 384+192=576
  - [-1, 3, C2f, [256]]          # 19  → 192ch
  - [-1, 1, CBAM, [192]]         # 20  ★ neck CBAM：top-down P3 融合输出 (192ch)  → Detect P3

  # === Bottom-up (PAN) ===
  - [-1, 1, Conv, [256, 3, 2]]   # 21  downsample from 20 → 192ch (256×0.75)
  - [[-1, 16], 1, Concat, [1]]   # 22  cat [21, 16] → 192+384=576
  - [-1, 3, C2f, [512]]          # 23  → 384ch
  - [-1, 1, CBAM, [384]]         # 24  ★ neck CBAM：bottom-up P4 融合输出 (384ch) → Detect P4

  - [-1, 1, Conv, [512, 3, 2]]   # 25  downsample from 24 → 384ch (512×0.75)
  - [[-1, 12], 1, Concat, [1]]   # 26  cat [25, 12] → 384+576=960
  - [-1, 3, C2f, [768]]          # 27  → 576ch
  - [-1, 1, CBAM, [576]]         # 28  ★ neck CBAM：bottom-up P5 融合输出 (576ch) → Detect P5

  - [[20, 24, 28], 1, Detect, [nc]]  # 29  Detect(P3=192ch, P4=384ch, P5=576ch)
