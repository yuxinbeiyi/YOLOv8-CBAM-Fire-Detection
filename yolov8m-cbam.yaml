
# YOLOv8m-CBAM: 在 P3、P4、SPPF 后各插入一个 CBAM 注意力模块
# 兼容: ultralytics 8.3.18, Python 3.12, PyTorch 2.10
#
# 通道说明 (width_multiple=0.75):
#   P3 实际通道: 256*0.75 = 192   → CBAM [192]
#   P4 实际通道: 512*0.75 = 384   → CBAM [384]
#   P5/SPPF 实际通道: 768*0.75 = 576 → CBAM [576]
#
# 注意: CBAM 不改变通道数，使用实际通道数（而非缩放前的值）以避免维度不匹配

nc: 2              # 类别数（火焰和smoke类）
depth_multiple: 0.67
width_multiple: 0.75

# backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]    # 0  - P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1  - P2/4
  - [-1, 3, C2f, [128, True]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]   # 3  - P3/8
  - [-1, 6, C2f, [256, True]]    # 4
  - [-1, 1, CBAM, [192]]         # 5  - P3 CBAM 注意力 (192=256×0.75)
  - [-1, 1, Conv, [512, 3, 2]]   # 6  - P4/16
  - [-1, 6, C2f, [512, True]]    # 7
  - [-1, 1, CBAM, [384]]         # 8  - P4 CBAM 注意力 (384=512×0.75)
  - [-1, 1, Conv, [768, 3, 2]]   # 9  - P5/32
  - [-1, 3, C2f, [768, True]]    # 10
  - [-1, 1, SPPF, [768, 5]]      # 11
  - [-1, 1, CBAM, [576]]         # 12 - SPPF CBAM 注意力 (576=768×0.75)

# head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13
  - [[-1, 8], 1, Concat, [1]]    # 14 - cat P4 CBAM (576+384=960)
  - [-1, 3, C2f, [512]]          # 15 - 384ch 输出

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 16
  - [[-1, 5], 1, Concat, [1]]    # 17 - cat P3 CBAM (384+192=576)
  - [-1, 3, C2f, [256]]          # 18 - P3/8-small, 192ch 输出

  - [-1, 1, Conv, [256, 3, 2]]   # 19 - 192ch
  - [[-1, 15], 1, Concat, [1]]   # 20 - cat head P4 (192+384=576)
  - [-1, 3, C2f, [512]]          # 21 - P4/16-medium, 384ch 输出

  - [-1, 1, Conv, [512, 3, 2]]   # 22 - 384ch
  - [[-1, 12], 1, Concat, [1]]   # 23 - cat SPPF CBAM (384+576=960)
  - [-1, 3, C2f, [768]]          # 24 - P5/32-large, 576ch 输出

  - [[18, 21, 24], 1, Detect, [nc]]  # 25 - Detect(P3=192, P4=384, P5=576)
